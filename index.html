<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قطب‌نما و تراز حبابی</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9eef0;--panel:#f7f9f9;--ink:#10272f;--mute:#5b7078;--line:#b9c7cc;--accent:#e4572e;--ok:#1f9d6b;--glass:#cfe3dc;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1a1f;--panel:#16272e;--ink:#e6f0f2;--mute:#8fa6ae;--line:#2c434c;--accent:#ff7a4d;--ok:#3ddc97;--glass:#1d3a3a}
}
:root[data-theme="dark"]{--bg:#0e1a1f;--panel:#16272e;--ink:#e6f0f2;--mute:#8fa6ae;--line:#2c434c;--accent:#ff7a4d;--ok:#3ddc97;--glass:#1d3a3a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:20px 18px 28px;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.15rem;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:.85rem;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{font:inherit;border:0;background:none;color:var(--mute);padding:10px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.readout{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:6px;direction:ltr}
.big{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.dir{font-size:1.1rem;color:var(--mute)}
svg{width:100%;height:auto;display:block}
.start{text-align:center}
.start p{color:var(--mute);line-height:1.8;margin:0 0 16px}
.btn{font:inherit;font-weight:700;border:0;background:var(--accent);color:#fff;padding:13px 26px;border-radius:14px;cursor:pointer;font-size:1rem}
.err{border-color:var(--accent)}
.err h2{margin:0 0 8px;font-size:1.05rem;color:var(--accent)}
.err p{margin:0;line-height:1.9;color:var(--ink)}
.angles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;direction:ltr;text-align:center}
.angles div{border:1px solid var(--line);border-radius:12px;padding:10px}
.angles b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.angles span{color:var(--mute);font-size:.8rem}
.status{text-align:center;margin-top:10px;font-weight:700;color:var(--mute);min-height:1.5em}
.status.ok{color:var(--ok)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>قطب‌نما و تراز حبابی</h1>
    <div class="sub">از سنسورهای جهت‌یابی دستگاه استفاده می‌کند.</div>
  </header>

  <section id="start" class="card start">
    <p>برای شروع، دسترسی به سنسورها را تأیید کنید. گوشی را به‌صورت افقی نگه دارید.</p>
    <button class="btn" id="startBtn">شروع</button>
  </section>

  <section id="error" class="card err" hidden>
    <h2>سنسور پیدا نشد</h2>
    <p id="errMsg"></p>
  </section>

  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabC" aria-selected="true">قطب‌نما</button>
      <button role="tab" id="tabL" aria-selected="false">تراز</button>
    </div>

    <section id="compass" class="card" style="margin-top:18px">
      <svg viewBox="0 0 300 300" aria-label="قطب‌نما">
        <g id="dial"></g>
        <path d="M150 6 L159 30 L141 30 Z" fill="var(--accent)"/>
        <circle cx="150" cy="150" r="5" fill="var(--ink)"/>
      </svg>
      <div class="readout"><span class="big" id="deg">0°</span><span class="dir" id="dirName">شمال</span></div>
    </section>

    <section id="level" class="card" style="margin-top:18px" hidden>
      <svg viewBox="0 0 300 300" aria-label="تراز حبابی">
        <circle cx="150" cy="150" r="140" fill="var(--glass)" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="150" cy="150" r="90" fill="none" stroke="var(--line)" stroke-width="1.5"/>
        <circle cx="150" cy="150" r="40" fill="none" stroke="var(--ink)" stroke-width="2" id="target"/>
        <path d="M150 10V290M10 150H290" stroke="var(--line)" stroke-width="1.5"/>
        <circle id="bubble" cx="150" cy="150" r="26" fill="var(--accent)" fill-opacity=".85" stroke="var(--ink)" stroke-width="2"/>
      </svg>
      <div class="status" id="status">—</div>
      <div class="angles">
        <div><b id="ax">0.0°</b><span>چپ / راست</span></div>
        <div><b id="ay">0.0°</b><span>جلو / عقب</span></div>
      </div>
    </section>
  </div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var startEl=$('start'),errEl=$('error'),appEl=$('app');
  var tilt={beta:null,gamma:null},heading=null,smooth=null,gotAbs=false,running=false,timer=null;
  var NAMES=['شمال','شمال شرقی','شرق','جنوب شرقی','جنوب','جنوب غربی','غرب','شمال غربی'];

  function fail(msg){
    running=false;clearTimeout(timer);
    window.removeEventListener('deviceorientation',onOri,true);
    window.removeEventListener('deviceorientationabsolute',onOri,true);
    startEl.hidden=true;appEl.hidden=true;errEl.hidden=false;
    $('errMsg').textContent=msg;
  }

  /* Build dial */
  (function(){
    var g=$('dial'),h='<circle cx="150" cy="150" r="140" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>';
    for(var a=0;a<360;a+=5){
      var major=a%30===0,len=major?16:(a%10===0?10:5),r1=136,r2=r1-len;
      var rad=a*Math.PI/180,s=Math.sin(rad),c=-Math.cos(rad);
      h+='<line x1="'+(150+s*r1)+'" y1="'+(150+c*r1)+'" x2="'+(150+s*r2)+'" y2="'+(150+c*r2)+'" stroke="'+(a===0?'var(--accent)':'var(--ink)')+'" stroke-width="'+(major?2.5:1.2)+'"/>';
    }
    var L=[['ش',0],['ق',90],['ج',180],['غ',270]];
    L.forEach(function(p){
      var rad=p[1]*Math.PI/180,x=150+Math.sin(rad)*98,y=150-Math.cos(rad)*98;
      h+='<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="700" fill="'+(p[1]===0?'var(--accent)':'var(--ink)')+'" transform="rotate('+p[1]+' '+x+' '+y+')">'+p[0]+'</text>';
    });
    [30,60,120,150,210,240,300,330].forEach(function(a){
      var rad=a*Math.PI/180,x=150+Math.sin(rad)*104,y=150-Math.cos(rad)*104;
      h+='<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--mute)" transform="rotate('+a+' '+x+' '+y+')" style="direction:ltr">'+a+'</text>';
    });
    g.innerHTML=h;
  })();

  /* Tilt-compensated heading from alpha/beta/gamma */
  function calcHeading(alpha,beta,gamma){
    var d=Math.PI/180,a=alpha*d,b=beta*d,g=gamma*d;
    var cA=Math.cos(a),sA=Math.sin(a),sB=Math.sin(b),cG=Math.cos(g),sG=Math.sin(g),cB=Math.cos(b);
    var rA=-cA*sG-sA*sB*cG, rB=-sA*sG+cA*sB*cG;
    var h=Math.atan(rA/rB);
    if(rB<0)h+=Math.PI; else if(rA<0)h+=2*Math.PI;
    return (h/d+360)%360;
  }

  function onOri(e){
    if(e.beta==null||e.gamma==null)return;
    tilt.beta=e.beta;tilt.gamma=e.gamma;
    var h=null;
    if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading)){
      h=e.webkitCompassHeading;
    }else if(e.alpha!=null&&(e.absolute===true||e.type==='deviceorientationabsolute')){
      h=calcHeading(e.alpha,e.beta,e.gamma);
    }
    if(h!=null){heading=h;gotAbs=true}
    if(running===false){running=true;clearTimeout(timer);appEl.hidden=false;startEl.hidden=true;check()}
  }

  function check(){
    /* Orientation works but no absolute heading after a moment => no magnetometer */
    setTimeout(function(){
      if(!gotAbs)fail('این دستگاه سنسور جهت‌یاب (مگنتومتر) ندارد، بنابراین قطب‌نما قابل اجرا نیست.');
    },2000);
  }

  function angDiff(a,b){return ((a-b+540)%360)-180}

  function frame(){
    if(running&&!errEl.hidden===false){
      if(heading!=null){
        smooth=smooth==null?heading:(smooth+angDiff(heading,smooth)*0.18+360)%360;
        $('dial').setAttribute('transform','rotate('+(-smooth)+' 150 150)');
        var d=Math.round(smooth)%360;
        $('deg').textContent=d+'°';
        $('dirName').textContent=NAMES[Math.round(smooth/45)%8];
      }
      if(tilt.beta!=null){
        var gx=Math.max(-45,Math.min(45,tilt.gamma)),by=Math.max(-45,Math.min(45,tilt.beta));
        var R=114,x=150+gx/45*R,y=150+by/45*R;
        var dx=x-150,dy=y-150,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist>R){x=150+dx/dist*R;y=150+dy/dist*R}
        var b=$('bubble');b.setAttribute('cx',x);b.setAttribute('cy',y);
        $('ax').textContent=tilt.gamma.toFixed(1)+'°';
        $('ay').textContent=tilt.beta.toFixed(1)+'°';
        var ok=Math.abs(tilt.gamma)<1&&Math.abs(tilt.beta)<1,st=$('status');
        st.textContent=ok?'تراز است':'در حال تنظیم…';
        st.className='status'+(ok?' ok':'');
        b.setAttribute('fill',ok?'var(--ok)':'var(--accent)');
      }
    }
    requestAnimationFrame(frame);
  }

  function begin(){
    if(!window.isSecureContext||!('DeviceOrientationEvent' in window)){
      fail('مرورگر یا دستگاه شما از سنسورهای جهت‌یابی پشتیبانی نمی‌کند. صفحه را روی یک گوشی یا تبلت و با اتصال امن (HTTPS) باز کنید.');
      return;
    }
    var go=function(){
      window.addEventListener('deviceorientationabsolute',onOri,true);
      window.addEventListener('deviceorientation',onOri,true);
      timer=setTimeout(function(){
        if(!running)fail('هیچ داده‌ای از سنسورها دریافت نشد. این دستگاه (مثلاً رایانه رومیزی) سنسور حرکتی یا جهت‌یاب ندارد.');
      },2500);
    };
    var D=window.DeviceOrientationEvent;
    if(typeof D.requestPermission==='function'){
      D.requestPermission().then(function(r){
        if(r==='granted')go();else fail('دسترسی به سنسورها رد شد. در تنظیمات مرورگر اجازهٔ «Motion & Orientation» را بدهید و دوباره امتحان کنید.');
      }).catch(function(){fail('درخواست دسترسی به سنسورها ناموفق بود.')});
    }else go();
  }

  $('startBtn').addEventListener('click',begin);
  function tab(c){
    $('compass').hidden=!c;$('level').hidden=c;
    $('tabC').setAttribute('aria-selected',c);$('tabL').setAttribute('aria-selected',!c);
  }
  $('tabC').addEventListener('click',function(){tab(true)});
  $('tabL').addEventListener('click',function(){tab(false)});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
